services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cade
      POSTGRES_USER: cade
      POSTGRES_PASSWORD: cade
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cade -d cade"]
      interval: 5s
      retries: 10

  # Captura os e-mails em desenvolvimento: interface em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cade
      MAIL_HOST: ${MAIL_HOST:-mailpit}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
