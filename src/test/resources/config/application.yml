# Configuração só dos testes. O Spring lê o classpath:/config/application.yml por cima do application.yml principal,
# então só o que está aqui muda (um application.yml na raiz de src/test/resources substituiria o principal inteiro).
cade:
  jwt:
    # Chave só de teste: o application.yml principal não tem valor padrão, então a aplicação não sobe sem JWT_SECRET.
    secret: test-only-secret-never-used-outside-the-tests-0123456789
