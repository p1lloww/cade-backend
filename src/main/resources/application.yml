spring:
  application:
    name: cade-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cade}
    username: ${DB_USER:cade}
    password: ${DB_PASSWORD:cade}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health

cade:
  dominio-email-permitido: ucsal.edu.br
  cors:
    origens-permitidas: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    segredo: ${JWT_SECRET:troque-este-segredo-local-com-pelo-menos-32-caracteres}
    validade: 8h
  email:
    remetente: ${MAIL_FROM:cade@localhost}
