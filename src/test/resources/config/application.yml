# Configuração só dos testes. O Spring lê o classpath:/config/application.yml por cima do application.yml principal,
# então só o que está aqui muda (um application.yml na raiz de src/test/resources substituiria o principal inteiro).
cade:
  jwt:
    # Chave só de teste: o application.yml principal não tem valor padrão, então a aplicação não sobe sem JWT_SECRET.
    secret: test-only-secret-never-used-outside-the-tests-0123456789
  photos:
    # Pasta temporária, para os testes não deixarem fotos no projeto.
    directory: ${java.io.tmpdir}/cade-test-photos
  notifications:
    # O reenvio agendado não roda sozinho nos testes: eles chamam o OutboxRelay quando precisam.
    relay-interval: 1h
    deadlines:
      interval: 1h
  loss-reports:
    # A tarefa dos prazos do registro não roda sozinha nos testes: eles chamam o LossReportExpiryJob quando precisam.
    expiry-interval: 1h
  pickup:
    # O vencimento agendado não roda sozinho nos testes: eles chamam o SummonsExpiryJob quando precisam.
    expiry-interval: 1h
