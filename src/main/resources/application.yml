spring:
  application:
    name: cade-backend
  config:
    # Lê o .env da raiz do projeto, para o `./mvnw spring-boot:run` receber as mesmas variáveis do Docker Compose.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cade}
    username: ${DB_USER:cade}
    password: ${DB_PASSWORD:cade}
  servlet:
    multipart:
      # Um pouco acima do limite da foto (cade.photos.max-size), para a mensagem vir do PhotoStorage.
      max-file-size: 6MB
      max-request-size: 7MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health

cade:
  allowed-email-domain: ucsal.edu.br
  login-code:
    ttl: 10m
    max-attempts: 5
    resend-interval: 1m
    block-after-locked-codes: 3
    block-duration: 15m
  initial-admin:
    email: ${ADMIN_EMAIL:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    # Sem valor padrão de propósito: sem JWT_SECRET a aplicação não sobe, em vez de assinar tokens com uma chave que
    # está pública neste repositório.
    secret: ${JWT_SECRET}
    ttl: 8h
  email:
    from: ${MAIL_FROM:cade@localhost}
  photos:
    # No Docker, um volume (compose.yaml); fora dele, a pasta data/ do projeto, ignorada pelo Git.
    directory: ${PHOTOS_DIR:data/photos}
    max-size: 5MB
  matching:
    # Pesos e faixas da compatibilidade (RN07, D22). A soma dos máximos (40 + 30 + 3 × 10) dá 100.
    date:
      recent-days: 3
      recent-points: 40
      close-days: 14
      close-points: 20
      tolerance-days: 1
    location:
      same-room-points: 30
      same-block-points: 15
    words:
      points-each: 10
      max-counted: 3
      min-length: 3
    bands:
      high: 70
      medium: 40
  retention:
    # Prazo de guarda desde a entrada na sala (RN16, validado com o administrador) e de quanto em quanto tempo a
    # tarefa procura os objetos vencidos (RF37).
    storage-period: 90d
    interval: 1h
  notifications:
    # Caixa de saída dos avisos (D30): tentativas, espera depois da 1ª falha (cresce a cada falha), de quanto em
    # quanto tempo o reenvio roda e quantos avisos ele pega por rodada.
    max-attempts: 5
    retry-delay: 5m
    relay-interval: 1m
    batch-size: 50
    deadlines:
      # De quanto em quanto tempo a tarefa procura prazos e com quanta antecedência avisa (RF34: 1 dia antes de a
      # convocação vencer; RF35: antes de o registro de perda vencer).
      interval: 1h
      summons-notice: 1d
      loss-report-notice: 3d
      # Desligado até o PER-06: hoje o registro de perda ainda não vence nem é renovado (D30).
      loss-report-notice-enabled: false
  pickup:
    # O que o estudante recebe na convocação (RF26). O prazo da convocação (RN15) é configurado pelo administrador.
    place: Sala de achados e perdidos da UCSal
    hours: Das 7h às 21h50
